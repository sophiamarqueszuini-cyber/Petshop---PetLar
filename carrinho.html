<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carrinho PetLar</title>
    <style>
        body { font-family: 'Zilla Slab', serif; background: #fcfbf9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #fff; padding: 40px; border: 1px solid #e0e0e0; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
        h2 { font-weight: 400; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Carrinho PetLar</h2>
        <p>Você precisa estar logado para finalizar o pedido.</p>
        <input type="email" placeholder="E-mail">
        <input type="password" placeholder="Senha">
        <button>Entrar no Carrinho</button>
        <p style="margin-top:20px; font-size: 0.9rem;">Não tem cadastro? <a href="#">Criar conta</a></p>
        <hr style="margin: 20px 0;">
        <p style="font-size: 0.8rem;">Opções: Pagamento Seguro, Entrega via Motoboy/Correios, Cupom de Desconto disponível no Checkout.</p>
    </div>
</body>
</html>
